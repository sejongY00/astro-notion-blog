<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="1200" height="560" fill="#ffffff"></rect>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"></path></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"></path></marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#151515">전환 후 구성</text>
  <text x="40" y="84" font-size="16" fill="#666">HTTPS는 Caddy 한 곳에서 끝나고, 각 서비스는 내부 HTTP로 받는다</text>

  
  <rect x="40" y="250" width="150" height="70" rx="12" fill="#f4f4f5" stroke="#d4d4d8"></rect>
