  <line x1="415" y1="285" x2="475" y2="285" stroke="#333" stroke-width="2" marker-end="url(#a)"></line>

  
  <rect x="480" y="200" width="300" height="170" rx="14" fill="#fafafa" stroke="#a1a1aa" stroke-dasharray="6 5"></rect>
