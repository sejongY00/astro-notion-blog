  <text x="630" y="332" font-size="14" text-anchor="middle" fill="#d4d4d8">호스트 20개 · FD 21개</text>

  
  <rect x="510" y="440" width="240" height="70" rx="12" fill="#fff7ed" stroke="#fdba74"></rect>
